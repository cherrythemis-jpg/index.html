<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For KHWL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* ကြယ်တွေ ရွေ့နေတဲ့ နောက်ခံ */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: moveStars linear infinite;
        }
        @keyframes moveStars {
            from { transform: translateY(0); }
            to { transform: translateY(-100vh); }
        }
        /* အလင်းတန်း လှိုင်း */
        .glow {
            position: fixed;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,100,200,0.4), transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 4s ease-in-out infinite;
            z-index: 2;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
        }
        /* အဓိက ကတ် */
        .card {
            position: relative;
            z-index: 3;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 100, 200, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            margin: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 60px rgba(255, 100, 200, 0.2);
            animation: fadeIn 2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .symbol {
            font-size: 3em;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 1.5em;
            color: #ff6b9d;
            letter-spacing: 8px;
            margin: 20px 0 10px;
            text-transform: uppercase;
        }
        .name {
            font-size: 3.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #ff6b9d, #c56cf0, #6bc5ff, #ff6b9d);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 4s linear infinite;
            letter-spacing: 5px;
            margin: 15px 0;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        .line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff6b9d, transparent);
            margin: 20px auto;
        }
        p {
            font-size: 1.1em;
            line-height: 2;
            color: #cccccc;
        }
        .highlight {
            color: #ff6b9d;
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 20px;
            animation: glowText 2s ease-in-out infinite alternate;
        }
        @keyframes glowText {
            from { text-shadow: 0 0 10px #ff6b9d; }
            to { text-shadow: 0 0 25px #ff6b9d, 0 0 40px #c56cf0; }
        }
        .footer {
            margin-top: 25px;
            font-size: 0.9em;
            color: #888;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="glow"></div>

    <div class="card">
        <div class="symbol">🌌</div>
        <h1>Congratulation</h1>
        <div class="name">KHWL</div>
        <div class="line"></div>
        <p>
            G12 ဆိုတဲ့ တောင်ကုန်းကို<br>
            အောင်မြင်စွာ ကျော်ဖြတ်နိုင်ခဲ့ပြီ။
        </p>
        <p>
            ဒီနေ့ဟာ မင်းရဲ့ ကြိုးစားမှုတွေရဲ့<br>
            သက်သေပဲ။
        </p>
        <div class="line"></div>
        <div class="highlight">
            မင်းရဲ့ အနာဂတ်ဟာ<br>
            ဒီကြယ်တွေလိုပဲ တောက်ပနေပါစေ ✨
        </div>
        <div class="footer">
            FROM SOMEONE WHO CARES ❤️
        </div>
    </div>

    <script>
        // ကြယ်တွေ ဖန်တီးခြင်း
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 10 + 10) + 's';
            star.style.animationDelay = Math.random() * 10 + 's';
            star.style.opacity = Math.random();
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
